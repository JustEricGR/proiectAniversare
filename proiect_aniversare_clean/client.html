<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Client</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body id="clientBody" class="client-start client-bg">
  <section id="startScreen" class="center-card">
    <h1 id="clientTitle">Bine ai venit!</h1>
    <p>Apasă pe buton ca să intri în meniu.</p>
    <button id="enterMenuBtn" class="primary-btn">Intră în meniu</button>
  </section>

  <section id="menuScreen" class="container hidden">
    <div class="card">
      <h1>Meniu principal</h1>
      <p>Alege una dintre opțiuni.</p>
      <div id="menuButtons" class="menu-buttons"></div>
    </div>
  </section>

  <section id="contentScreen" class="container hidden">
    <div class="card content-view">
      <h1 id="contentTitle"></h1>
      <div id="imagesContainer"></div>
      <div id="textContainer"></div>
      <div id="youtubeContainer"></div>
    </div>
  </section>

  <div id="backHomeBox" class="bottom-center hidden">
    <button id="backHomeBtn">Înapoi la meniul principal</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="js/client.js"></script>
</body>
</html>
