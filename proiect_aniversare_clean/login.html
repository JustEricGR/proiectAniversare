<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Admin</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="home-page">
  <main class="center-card login-card">
    <h1>Login Admin</h1>
    <p>Intră cu emailul și parola create în Supabase Authentication.</p>

    <label>Email admin</label>
    <input id="email" type="email" placeholder="emailul tau" autocomplete="email" />

    <label>Parolă admin</label>
    <input id="password" type="password" placeholder="parola" autocomplete="current-password" />

    <button id="loginBtn" class="primary-btn">Intră în admin</button>
    <p id="message" class="status error"></p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
